overlay: 1.0.0
info:
  title: API Evangelist enhancements for Orderly Network EVM API
  version: 1.0.0
extends: openapi/orderly-network-openapi-original.yml
actions:
  - target: $.info
    update:
      x-apievangelist-enriched: '2026-07-20'
      x-authentication: ed25519 request signing via orderly-* headers (see authentication/)
      x-error-catalog: errors/orderly-network-error-codes.yml
      x-conventions: conventions/orderly-network-conventions.yml
      x-data-model: data-model/orderly-network-data-model.yml
  - target: $.info
    update:
      x-agentic-access: agentic-access/orderly-network-agentic-access.yml
      x-mcp-server: https://mcp.orderly.network
      x-websocket-asyncapi: asyncapi/orderly-network-websocket-asyncapi.yml
  - target: $.servers
    update:
      - url: https://api.orderly.org
        description: Mainnet
      - url: https://testnet-api.orderly.org
        description: Testnet
