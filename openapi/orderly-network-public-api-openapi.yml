components:
  parameters:
    orderly_account_id:
      name: orderly-account-id
      in: header
      description: Account ID of the authenticated account.
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: 6858456565150414647678309700218930773992665872576093615984574980646847042886
    orderly_signature:
      name: orderly-signature
      in: header
      description: Signature of the request payload generated with the orderly key.
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: dG4bkKiqG0dUYLzViRZkvbI6Sy239JxAdNMIBxFZ4w030Jofr0ORV06GHtvXZkaZaWUXE+XAU3fnzKN/5fDeBQ==
    orderly_key:
      name: orderly-key
      in: header
      description: Public orderly key used to sign the request.
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: ed25519:8tm7dnKYkSc3FzgPuJaw1wztr79eeZpN35nHW5pL5XhX
    orderly_timestamp:
      name: orderly-timestamp
      in: header
      description: Timestamp of the signed request in milliseconds.
      required: true
      style: simple
      explode: false
      schema:
        type: string
      example: '1649920583000'
  schemas:
    CheckReferralCodeResponse:
      allOf:
      - $ref: '#/components/schemas/BasicResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: object
            properties:
              referral_code:
                type: string
                example: code
    GetBrokerResponse:
      allOf:
      - $ref: '#/components/schemas/BasicResponse'
      - type: object
        required:
        - data
        properties:
          data:
            type: object
            properties:
              broker_id:
                description: Broker IDs associated with the queried wallet address.
                type: array
                items:
                  type: string
                  example: woofi_pro
    VenueTransferHistoryResponse:
      allOf:
      - $ref: '#/components/schemas/BasicResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              meta:
                type: object
                properties:
                  total:
                    type: number
                    example: 2
                  records_per_page:
                    type: number
                    example: 25
                  current_page:
                    type: number
                    example: 1
                    description: start from 1
              rows:
                type: array
                items:
                  type: object
                  properties:
                    created_time:
                      type: number
                      example: 1739257560000
                    executed_time:
                      type: number
                      example: 1739257561000
                    period_number:
                      type: number
                      example: 2
                    plan_id:
                      type: number
                      example: 3
                    amount:
                      type: number
                      example: 13633.532389
                    status:
                      type: string
                      example: completed
    GetCampaignsResponse:
      allOf:
      - $ref: '#/components/schemas/BasicResponse'
      - type: object
        properties:
          data:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                    name:
                      type: string
                      example: campaign_20230806
                    start_time:
                      type: integer
                      example: 1575014255089
                    end_time:
                      type: integer
                      example: 1585014255089
                    signup_start_time:
                      type: integer
