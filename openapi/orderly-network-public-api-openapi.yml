openapi: 3.2.0
info:
  title: Orderly Network Public API
  version: 1.0.0
  description: 'Operations tagged public across 2 of this provider''s published API definitions: orderly-network-openapi-original.yml, orderly-network-strategy-vault-openapi-original.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.orderly.org
  description: Mainnet
- url: https://testnet-api.orderly.org
  description: Testnet
- url: https://api-sv.orderly.org
  description: Mainnet
- url: https://testnet-api-sv.orderly.org
  description: Testnet
tags:
- name: public
paths:
  /v1/public/futures:
    get:
      summary: Get market info for all symbols
      deprecated: false
      description: '

        **Limit: 10 requests per 1 second per IP address**


        `GET /v1/public/futures`


        Get basic market information for all the symbols.

        '
      tags:
      - public
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FuturesInfoResponse'
    servers:
    - url: https://api.orderly.org
      description: Mainnet
    - url: https://testnet-api.orderly.org
      description: Testnet
  /v1/ip_info:
    get:
      summary: Get IP info
      deprecated: false
      description: '

        **Limit: 10 requests per 1 second per IP address**


        `GET /v1/ip_info`


        Returns the detected IP address and location metadata for the calling client.

        '
      tags:
      - public
      parameters: []
      responses:
        '200':
          description: Success
          content:
