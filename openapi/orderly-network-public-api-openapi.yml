      description: '

        **Limit: 5 request per 10 second per IP address**


        `GET /v1/tv/kline_history`


        Get the historical klines of the specified symbol

        '
      tags:
      - public
      parameters:
      - name: symbol
        in: query
        description: Symbol name
        required: true
        example: PERP_BTC_USDC
        schema:
          type: string
      - name: resolution
        in: query
        description: '`1m/5m/15m/30m/1h/4h/12h/1d/1w/1mon`'
        required: true
        example: 1d
        schema:
          type: string
      - name: from
        in: query
        description: If the range from from to to contains 1200 klines, only 1000 klines will be returned, starting from to and moving backward (due to the limit).
        required: false
        example: '1761926400'
        schema:
          type: string
      - name: to
        in: query
        description: If the range from from to to contains only 500 klines, then all 500 will be returned, starting from to and moving backward.
        required: false
        example: '1762790400'
        schema:
          type: string
      - name: limit
        in: query
        description: Numbers of klines you want to query.  Maximum of 1000 klines allowed.
        required: false
        example: '1000'
        schema:
          type: number
      - $ref: '#/components/parameters/orderly_timestamp'
      - $ref: '#/components/parameters/orderly_account_id'
      - $ref: '#/components/parameters/orderly_key'
      - $ref: '#/components/parameters/orderly_signature'
