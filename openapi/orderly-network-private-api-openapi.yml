        `GET /v1/admin/orders`


        Note: This endpoint requires `trading` scope in orderly key.

        '
      tags:
      - private
      parameters:
      - name: symbol
        in: query
        description: Filter results to a specific trading symbol, for example `PERP_ETH_USDC`.
        required: false
        example: PERP_ETH_USDC
        schema:
          type: string
      - name: side
        in: query
        description: '`BUY`/`SELL`'
        required: false
        example: ''
        schema:
          type: string
      - name: order_type
        in: query
        description: '`LIMIT`/`MARKET`'
        required: false
        example: ''
        schema:
          type: string
      - name: status
        in: query
        description: '`NEW`/`CANCELLED`/`PARTIAL_FILLED`/`FILLED`/`REJECTED`/`INCOMPLETE`/`COMPLETED`'
        required: false
        example: ''
        schema:
          type: string
      - name: order_tag
        in: query
        description: Filter by a custom tag assigned to the order.
        required: false
        example: ''
        schema:
          type: string
      - name: start_t
        in: query
        description: start time range that wish to query, noted the time stamp is 13-digits timestamp.
        required: false
        example: ''
        schema:
          type: number
      - name: end_t
        in: query
        description: end time range that wish to query, noted the time stamp is 13-digits timestamp.
        required: false
        example: ''
        schema:
          type: number
      - name: page
        in: query
        description: the page you wish to query. start from 1
        required: false
        example: ''
        schema:
          type: number
      - name: size
        in: query
        description: 'the page size you wish to query (max: 500)'
        required: false
        example: ''
        schema:
          type: number
      - name: sort_by
        in: query
        description: "If empty: \n\nDescending order by updated_time if user passed update_start_t or update_end_t; descending order by order_id if updated_time are the same; \n\nOtherwise descending order by created_time; descending order by order_id if created_time are the same;\n\n\nIf not empty:\n\nIf sort_by == `CREATED_TIME_DESC`, descending order by created_time. Descending order by order_id if created_time are same;\n\nIf sort_by == `CREATED_TIME_ASC`, ascending order by created_time. Ascending order by order_id if created_time are same;\n\nIf sort_by == `UPDATED_TIME_DESC`, descending order by updated_time. Descending order by order_id if updated_time are same;\n\nIf sort_by == `UPDATED_TIME_ASC`, ascending order by updated_time. Ascending order by order_id if updated_time are same;\n"
        schema:
          type: string
      - name: user_account
        in: query
        description: Target user account to query for admin usage, required for either user_account or user_address
        required: false
        example: ''
        schema:
          type: string
      - name: user_address
        in: query
        description: Target user address to query for admin usage, required for either user_account or user_address
        required: false
        example: ''
        schema:
          type: string
      - $ref: '#/components/parameters/orderly_timestamp'
      - $ref: '#/components/parameters/orderly_account_id'
      - $ref: '#/components/parameters/orderly_key'
      - $ref: '#/components/parameters/orderly_signature'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
