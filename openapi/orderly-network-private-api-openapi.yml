      type: object
      properties:
        symbol:
          type: string
          example: PERP_ETH_USDC
        client_order_id:
          type: string
          description: '36 length, accepts hyphen but cannot be the first character, default: null'
        order_type:
          type: string
          description: '`LIMIT`/`MARKET`/`IOC`/`FOK`/`POST_ONLY`/`ASK`/`BID`'
        order_price:
          type: number
          description: If order_type is MARKET/ASK/BID, then is not required, otherwise this parameter is required.
        order_quantity:
          type: number
          description: ''
        order_amount:
          type: number
          description: For MARKET/ASK/BID order, the order size in terms of quote currency
        visible_quantity:
          type: number
          description: 'The order quantity shown on orderbook. (default: equal to order_quantity)

            Visible quantity is not supported for post-only orders.

            '
        side:
          type: string
          description: '`SELL`/`BUY`'
        reduce_only:
          type: boolean
          description: Default false
        slippage:
          type: number
          description: '`MARKET` orders beyond this slippage will not be executed'
        order_tag:
          type: string
          description: 'Optional tag for the order. Supports two formats:

            - Referral code: plain string (e.g., `REFERRAL2026`) - overrides referral relationship

            - Order tag fee config: `enum:<enum_id>` (e.g., `enum:STRATEGY_DCA`) - adds fee on top of existing fees, preserves referral

            Max length: 36 characters. Cannot be modified after order placement.

            '
        level:
          type: number
          description: Integer value from `0` to `4`. This parameter controls wether to present the price of bid0 to bid4 or ask0 to ask4. Only allowed when `order_type` is `BID` or `ASK`.
        post_only_adjust:
          type: boolean
          description: If set to true, then price will be adjusted to 1 tick close to current best price. Only supported for `POST_ONLY` type orders
        margin_mode:
          type: string
          description: 'Margin mode for the order. Default: the symbol''s current default margin mode.'
          enum:
          - CROSS
          - ISOLATED
