aid: orderly-network
name: Orderly Network
description: >-
  Orderly Network is an omnichain, orderbook-based trading infrastructure that
  provides perpetual-futures liquidity for decentralized exchanges and builders.
  It exposes a full EVM REST API and WebSocket streams for order management,
  account and sub-account handling, cross-chain deposits/withdrawals, positions,
  settlement, and market data, plus a Strategy Vault API and a zero-auth Public
  Info API aimed at AI agents and analytics. Authentication uses ed25519 request
  signing with registered Orderly Keys. Builders integrate via React component
  and hooks SDKs, a devkit CLI, a Builders Marketplace plugin system, and an
  official MCP server. Markets use the PERP_<TOKEN>_USDC symbol format across a
  public mainnet and testnet.
